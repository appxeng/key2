name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Unzip project if needed
        run: |
          if [ -z "$(find . -name settings.gradle.kts | head -n1)" ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -q -o "$z"
            done
          fi

      - name: Find project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then
            echo "::error title=Project not found::settings.gradle.kts was not found in the repo"
            ls -R | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show error summary
        if: failure()
        run: |
          msg=$(grep -E -A6 '^e: |What went wrong|error:' build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=Build error::$msg"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveKeyboard-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
